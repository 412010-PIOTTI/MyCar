spring.application.name=mycar

app.jwt.secret=${JWT_SECRET:change-this-in-production-at-least-32-chars!!}
app.jwt.expiration-ms=86400000

app.sendgrid.api-key=${SENDGRID_API_KEY:}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@mycar.app}

app.exchange-rate.api-key=${EXCHANGE_RATE_API_KEY:}
app.exchange-rate.base-url=${EXCHANGE_RATE_BASE_URL:https://v6.exchangerate-api.com/v6}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.frontend.url=${FRONTEND_URL:http://localhost:4200}

app.storage.documents-dir=${DOCUMENTS_STORAGE_DIR:./uploads/documents}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chat IA con RAG sobre manuales de fabricante
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-small
app.ai.vector-store.path=${AI_VECTOR_STORE_PATH:./data/manuals-vector-store.json}
app.ai.manuals-ingestion.enabled=${AI_MANUALS_INGESTION_ENABLED:true}
