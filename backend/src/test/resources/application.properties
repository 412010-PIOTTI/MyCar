# Configuracion de tests — usa H2 en memoria, no requiere SQL Server
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-for-unit-and-slice-tests-32chars!!
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:4200

app.storage.documents-dir=${java.io.tmpdir}/mycar-test-documents

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chat IA — key dummy para que el contexto de Spring levante sin llamar a OpenAI de verdad;
# la ingesta de manuales se desactiva para que ningún test dispare embeddings reales.
spring.ai.openai.api-key=test-key-not-real
app.ai.manuals-ingestion.enabled=false
app.ai.vector-store.path=${java.io.tmpdir}/mycar-test-vector-store.json
