<aside class="flex flex-col h-screen bg-white border-r border-surface-border flex-shrink-0" style="width: 240px">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-4 border-b border-surface-border" style="height: 64px">
    <div class="flex items-center justify-center bg-primary rounded-md" style="width:40px;height:40px">
      <svg class="text-white" style="width:22px;height:22px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 9l-1.5-4.5A2 2 0 0015.6 3H8.4a2 2 0 00-1.9 1.5L5 9M3 9h18M5 9v9a2 2 0 002 2h10a2 2 0 002-2V9" />
        <circle cx="7.5" cy="18" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="16.5" cy="18" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <span class="text-lg font-bold text-text-primary">MyCar</span>
  </div>

  <!-- Main nav -->
  <nav class="flex-1 px-2 py-3 overflow-y-auto space-y-0.5">

    <a routerLink="/dashboard"
      class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium transition-colors"
      [ngClass]="isActive('/dashboard') ? 'bg-primary text-white' : 'text-text-secondary hover:bg-gray-50 hover:text-text-primary'">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
      </svg>
      Dashboard
    </a>

    <a routerLink="/vehicles"
      class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium transition-colors"
      [ngClass]="isActive('/vehicles') ? 'bg-primary text-white' : 'text-text-secondary hover:bg-gray-50 hover:text-text-primary'">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19 9l-1.5-4.5A2 2 0 0015.6 3H8.4a2 2 0 00-1.9 1.5L5 9M3 9h18M5 9v9a2 2 0 002 2h10a2 2 0 002-2V9" />
        <circle cx="7.5" cy="18" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="16.5" cy="18" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
      Mis vehículos
    </a>

    <span class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium text-text-muted cursor-not-allowed select-none">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" />
      </svg>
      Mantenimiento
    </span>

    <a routerLink="/expenses"
      class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium transition-colors"
      [ngClass]="isActive('/expenses') ? 'bg-primary text-white' : 'text-text-secondary hover:bg-gray-50 hover:text-text-primary'">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
      </svg>
      Gastos
    </a>

    <span class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium text-text-muted cursor-not-allowed select-none">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      Documentos
    </span>

    <span class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium text-text-muted cursor-not-allowed select-none">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      Alertas
    </span>

    <span class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium text-text-muted cursor-not-allowed select-none">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
      Transferencias
    </span>

    <span class="flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium text-text-muted cursor-not-allowed select-none">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      AI Chat
    </span>

  </nav>

  <!-- Footer nav -->
  <div class="border-t border-surface-border px-2 py-3 space-y-0.5">
    <a routerLink="/settings"
      class="flex items-center gap-3 px-3 py-2 rounded text-sm font-medium transition-colors"
      [ngClass]="isActive('/settings') ? 'bg-primary text-white' : 'text-text-secondary hover:bg-gray-50 hover:text-text-primary'">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      Configuración
    </a>

    <button
      (click)="logout()"
      class="flex items-center gap-3 px-3 py-2 rounded text-sm font-medium w-full text-left
             text-danger hover:bg-danger-light transition-colors">
      <svg class="flex-shrink-0" style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      Cerrar sesión
    </button>
  </div>

</aside>
